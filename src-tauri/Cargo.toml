[package]
name = "aimitra"
version = "0.1.0"
edition = "2021"
description = "Local AI Assistant"
authors = ["AiMitra Team"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
walkdir = "2.5"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
sysinfo = { version = "0.30", features = ["default"] }
axum = { version = "0.8", features = ["json", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
parking_lot = "0.12"
once_cell = "1.19"

# CLI-specific dependencies
clap = { version = "4.5", features = ["derive", "env"] }
console = "0.15"
indicatif = "0.17"
crossterm = "0.27"
which = "4"

# MCP (Model Context Protocol) - from claude-code
rmcp = { version = "0.1", features = ["server", "client"] }

# Protocol conversion - from deepseek-recipe
schemars = { version = "0.8", features = ["derive"] }
tokio-stream = "0.1"

# Configuration & validation
figment = { version = "0.10", features = ["toml"] }
config = "0.15"

# Skills & plugins
notify = "6.1"
walkdir = "2.5"

# Evaluation & benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

# PonyTail - Enhanced plugin support
ponytail = "0.1"
