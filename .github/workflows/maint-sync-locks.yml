# TEMPORARY: regenerates lockfiles on a runner that has network access, then
# commits them back to the maint/** branch. Removed again before the PR is merged.
name: Temporary lockfile sync

on:
  push:
    branches: ['maint/**']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Sync Cargo.lock with Cargo.toml and apply safe bumps
        working-directory: src-tauri
        run: |
          cargo update --workspace
          cargo update -p tauri -p tauri-build -p uuid

      - name: Sync package-lock.json
        run: |
          npm install --package-lock-only --ignore-scripts
          npm update @tauri-apps/api @tauri-apps/cli @types/bun autoprefixer --package-lock-only --ignore-scripts

      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock package-lock.json
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "chore: sync lockfiles"
          git push
